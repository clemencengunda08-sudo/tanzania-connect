<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Brand gradient Blue to Purple -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>

    <!-- Shine overlay top -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>

    <!-- Glow filter for letters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop shadow for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1e40af" flood-opacity="0.35"/>
    </filter>

    <!-- Clip to rounded square shape -->
    <clipPath id="roundClip">
      <rect width="512" height="512" rx="115" ry="115"/>
    </clipPath>
  </defs>

  <!-- Background rounded square with gradient -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#brandGrad)" filter="url(#shadow)"/>

  <!-- Shine on top half -->
  <rect width="512" height="280" rx="115" ry="115" fill="url(#shineGrad)" clip-path="url(#roundClip)"/>

  <!-- Subtle grid lines — map/data feel -->
  <g clip-path="url(#roundClip)" opacity="0.06">
    <line x1="0" y1="128" x2="512" y2="128" stroke="white" stroke-width="1.5"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="white" stroke-width="1.5"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="white" stroke-width="1.5"/>
    <line x1="128" y1="0" x2="128" y2="512" stroke="white" stroke-width="1.5"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="white" stroke-width="1.5"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="white" stroke-width="1.5"/>
  </g>

  <!-- Decorative ring top-right corner -->
  <circle cx="420" cy="92" r="80" fill="none" stroke="white" stroke-width="1" stroke-dasharray="10 7" opacity="0.15" clip-path="url(#roundClip)"/>

  <!-- Small location dot top center -->
  <circle cx="256" cy="72" r="9" fill="white" opacity="0.55"/>

  <!-- LETTER T -->
  <rect x="58" y="172" width="188" height="50" rx="13" fill="white" filter="url(#glow)"/>
  <rect x="130" y="172" width="50" height="196" rx="13" fill="white"/>

  <!-- LETTER R -->
  <rect x="270" y="172" width="50" height="196" rx="13" fill="white" filter="url(#glow)"/>
  <path d="M320 172 h56 a52 52 0 0 1 0 104 h-56 Z" fill="white"/>
  <path d="M328 196 h38 a28 28 0 0 1 0 56 h-38 Z" fill="url(#brandGrad)"/>
  <path d="M352 276 L446 366 a16 16 0 0 1-23 23 L332 300 Z" fill="white"/>

  <!-- Bottom accent bar -->
  <rect x="90" y="404" width="332" height="5" rx="2.5" fill="white" opacity="0.2"/>

  <!-- Three dots — professional finish -->
  <circle cx="196" cy="434" r="5" fill="white" opacity="0.35"/>
  <circle cx="256" cy="434" r="5" fill="white" opacity="0.65"/>
  <circle cx="316" cy="434" r="5" fill="white" opacity="0.35"/>
</svg>